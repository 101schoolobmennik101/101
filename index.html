<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обменник — МБОУ СОШ №101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EC; --paper2:#F3EDDD; --ink:#2B3A2E; --ink-soft:#5B6B5C;
    --line:#C7D8C6; --margin:#C24A3E; --accent:#3B6E4E; --accent-dark:#2C5A3D;
    --mustard:#E3A23B; --card:#ffffff; --border:#DCE3D2;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B241C; --paper2:#20291F; --ink:#EDEFE7; --ink-soft:#A7B4A2;
      --line:#324435; --margin:#C24A3E; --accent:#6FAE83; --accent-dark:#5A9770;
      --mustard:#E3A23B; --card:#242E23; --border:#33402F;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B241C; --paper2:#20291F; --ink:#EDEFE7; --ink-soft:#A7B4A2;
    --line:#324435; --margin:#C24A3E; --accent:#6FAE83; --accent-dark:#5A9770;
    --mustard:#E3A23B; --card:#242E23; --border:#33402F;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px),
      var(--paper);
    color:var(--ink); font-family:'PT Sans',sans-serif; position:relative;
  }
  body::before{
    content:""; position:fixed; top:0; bottom:0; left:38px; width:2px; background:var(--margin); opacity:.55; z-index:0;
  }
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 18px 14px 52px; background:var(--paper2); border-bottom:2px solid var(--border);
  }
  .brand{display:flex; flex-direction:column; line-height:1.15;}
  .brand b{font-family:'PT Serif',serif; font-size:22px;}
  .brand span{font-size:11px; color:var(--ink-soft);}
  .profile-chip{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border);
    border-radius:999px; padding:6px 12px 6px 6px; cursor:pointer; font-size:14px; white-space:nowrap;
  }
  .avatar{width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex;
    align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'PT Serif',serif;}
  main{position:relative; z-index:1; padding:22px 18px 100px 52px; max-width:1000px; margin:0 auto;}
  h1.page-title{
    font-family:'PT Serif',serif; font-size:32px; margin:0 0 26px; position:relative;
    display:inline-block; letter-spacing:.2px;
  }
  h1.page-title::after{
    content:""; position:absolute; left:-2px; right:-6px; bottom:-8px; height:10px;
    background:var(--mustard); opacity:.5; border-radius:3px 6px 4px 7px;
    transform:rotate(-.6deg); z-index:-1;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .15s ease, box-shadow .15s ease;
  }
  @media (hover:hover){
    .card:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.10); }
  }
  .card .photo{width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--paper2);}
  .photo-placeholder{
    width:100%; aspect-ratio:4/3; background:var(--paper2); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:34px;
  }
  .card .body{padding:10px 11px 12px; display:flex; flex-direction:column; gap:5px; flex:1;}
  .card h3{font-family:'PT Serif',serif; margin:0; font-size:15px; line-height:1.25;}
  .card p.desc{margin:0; font-size:12px; color:var(--ink-soft); flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card{cursor:pointer;}
  .want{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; background:rgba(227,162,59,.15);
    color:var(--mustard); border:1px solid rgba(227,162,59,.4); padding:4px 9px; border-radius:999px; align-self:flex-start;
  }

  /* Detail sheet */
  .detail-sheet{max-width:640px; padding:0; overflow:hidden; display:flex; flex-direction:column;}
  .detail-photo{width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--paper2);}
  .detail-photo-placeholder{width:100%; aspect-ratio:4/3; background:var(--paper2); display:flex; align-items:center; justify-content:center; font-size:52px; color:var(--ink-soft);}
  .detail-body{padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px)); overflow-y:auto;}
  .detail-body h2{font-family:'PT Serif',serif; font-size:22px; margin:0 0 8px;}
  .detail-body .want{font-size:14px; padding:6px 12px; margin-bottom:14px;}
  .detail-body p.full-desc{font-size:14px; line-height:1.5; color:var(--ink); margin:0 0 16px;}
  .detail-author{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
  .close-x{
    position:absolute; top:12px; right:14px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.35);
    color:#fff; border:none; font-size:18px; cursor:pointer; z-index:2; line-height:0;
  }

  /* Chat */
  .chat-list-item{
    width:100%; text-align:left; background:var(--paper); border:1px solid var(--border);
    border-radius:10px; padding:12px; cursor:pointer;
  }
  .chat-list-item:hover{background:var(--paper2);}
  .chat-list-title{font-weight:700; font-size:14px; margin-bottom:3px;}
  .chat-list-preview{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chat-list-empty{color:var(--ink-soft); font-size:13px; text-align:center; padding:28px 8px;}
  .chat-sheet{max-width:520px; display:flex; flex-direction:column; height:70vh; padding:0;}
  .chat-header{padding:16px 20px; border-bottom:1px solid var(--border); font-family:'PT Serif',serif; font-size:17px;}
  .chat-messages{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:78%; padding:8px 12px; border-radius:12px; font-size:14px; line-height:1.35;}
  .msg.me{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px;}
  .msg.them{align-self:flex-start; background:var(--paper2); border:1px solid var(--border); border-bottom-left-radius:3px;}
  .chat-empty{color:var(--ink-soft); font-size:13px; text-align:center; margin-top:20px;}
  .chat-input-row{display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--border);}
  .chat-input-row input{flex:1;}
  .chat-input-row button{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 16px; font-size:14px; cursor:pointer;}
  .card footer{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .del-btn{background:none; border:none; color:var(--margin); cursor:pointer; font-size:12px; padding:0;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty b{display:block; font-family:'PT Serif',serif; font-size:19px; color:var(--ink); margin-bottom:6px;}
  .fab{
    position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:28px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25);
    z-index:6; line-height:0;
  }
  .fab:active{background:var(--accent-dark);}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; display:none; align-items:flex-end;
    justify-content:center; padding-top:env(safe-area-inset-top,0px);
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:560px; border-radius:16px 16px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow-y:auto; border-top:1px solid var(--border);
  }
  .sheet h2{font-family:'PT Serif',serif; margin:0 0 14px; font-size:20px;}
  label{display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 6px;}
  input[type=text], textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card);
    color:var(--ink); font-family:'PT Sans',sans-serif; font-size:14px;
  }
  textarea{min-height:70px; resize:vertical;}
  .photo-drop{
    border:2px dashed var(--border); border-radius:10px; padding:16px; text-align:center; color:var(--ink-soft);
    cursor:pointer; font-size:13px; position:relative; overflow:hidden;
  }
  .photo-drop img{max-width:100%; max-height:160px; border-radius:8px; display:block; margin:0 auto;}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  button.primary{
    flex:1; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:8px; font-size:15px;
    font-weight:700; cursor:pointer; font-family:'PT Sans',sans-serif;
  }
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--ink); padding:12px 16px; border-radius:8px; cursor:pointer;
  }
  .hint{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <b>🔄 Обменник</b>
    <span>МБОУ СОШ №101 · Воронеж</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="ghost" id="openChatsBtn" style="padding:8px 10px;">💬 Чаты</button>
    <div class="profile-chip" id="profileChip">
      <div class="avatar" id="avatarLetter">?</div>
      <span id="nickLabel">Задать ник</span>
    </div>
  </div>
</header>

<main>
  <h1 class="page-title">Доска обмена</h1>
  <div class="grid" id="grid"></div>
</main>

<button class="fab" id="fabAdd" aria-label="Добавить объявление">+</button>

<!-- Profile sheet -->
<div class="overlay" id="profileOverlay">
  <div class="sheet">
    <h2>Твой профиль</h2>
    <label for="nickInput">Никнейм</label>
    <input type="text" id="nickInput" placeholder="Например, Кот_из_9Б" maxlength="24">
    <p class="hint">Этот ник будут видеть другие рядом с твоими объявлениями.</p>
    <div class="sheet-actions">
      <button class="ghost" id="profileCancel">Отмена</button>
      <button class="primary" id="profileSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- New listing sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h2>Новое объявление</h2>
    <label>Фото товара</label>
    <div class="photo-drop" id="photoDrop">
      <span id="photoDropText">Нажми, чтобы выбрать фото</span>
    </div>
    <input type="file" id="photoInput" accept="image/*">

    <label for="titleInput">Название товара</label>
    <input type="text" id="titleInput" placeholder="Например, Наушники JBL" maxlength="60">

    <label for="descInput">Описание</label>
    <textarea id="descInput" placeholder="Состояние, особенности, почему отдаёшь"></textarea>

    <label for="wantInput">На что меняешь</label>
    <input type="text" id="wantInput" placeholder="Например, на настольную игру или комиксы" maxlength="80">

    <div class="sheet-actions">
      <button class="ghost" id="addCancel">Отмена</button>
      <button class="primary" id="addSave">Разместить</button>
    </div>
  </div>
</div>

<!-- Listing detail sheet (Avito-style) -->
<div class="overlay" id="detailOverlay">
  <div class="sheet detail-sheet" style="position:relative;">
    <button class="close-x" id="detailClose">✕</button>
    <div id="detailPhotoWrap"></div>
    <div class="detail-body">
      <h2 id="detailTitle"></h2>
      <span class="want" id="detailWant"></span>
      <p class="full-desc" id="detailDesc"></p>
      <div class="detail-author">
        <div class="avatar" id="detailAvatar" style="width:22px;height:22px;font-size:11px;"></div>
        <span id="detailAuthor"></span>
      </div>
      <div class="sheet-actions" style="margin-top:0;">
        <button class="primary" id="detailChatBtn">💬 Открыть чат</button>
      </div>
    </div>
  </div>
</div>

<!-- Chats list -->
<div class="overlay" id="chatsOverlay">
  <div class="sheet" style="max-width:520px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <h2 style="margin:0;">Мои чаты</h2>
      <button class="ghost" id="chatsClose">Закрыть</button>
    </div>
    <div id="chatList" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;"></div>
  </div>
</div>

<!-- Chat sheet -->
<div class="overlay" id="chatOverlay">
  <div class="sheet chat-sheet">
    <div class="chat-header" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span id="chatHeader"></span>
      <button class="ghost" id="chatClose" style="padding:7px 10px;white-space:nowrap;">← К объявлению</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Написать сообщение...">
      <button id="chatSend">Отправить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== Supabase ===== */
const SUPABASE_URL = "https://cnlcaeqrdvbcsecniaig.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_V7JeROrWTj3Xm3E3LXFW_w_vwQ1P9ZF";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STORAGE_BUCKET = "listing-photos";

let authUser = null;
let listings = [];
let nickname = "";
let pendingPhoto = null;
let currentListingId = null;

async function ensureAuth(){
  const { data: sessionData } = await sb.auth.getSession();
  if(sessionData?.session?.user){ authUser = sessionData.session.user; return authUser; }
  const { data, error } = await sb.auth.signInAnonymously();
  if(error) throw error;
  authUser = data.user;
  return authUser;
}

async function loadProfile(){
  // После чистого сброса профиль нового anonymous-пользователя
  // создаётся триггером в Supabase. Здесь только читаем его.
  const { data, error } = await sb.from("profiles")
    .select("id,nickname")
    .eq("id", authUser.id)
    .maybeSingle();

  if(error) throw error;

  // Защита от редкого случая, когда триггер ещё не успел создать строку.
  if(!data){
    const { data: created, error: createError } = await sb.from("profiles")
      .insert({ id: authUser.id, nickname: "" })
      .select("id,nickname")
      .single();
    if(createError) throw createError;
    nickname = created?.nickname || "";
    return;
  }

  nickname = data.nickname || "";
}

async function saveProfile(nick){
  const { data, error } = await sb.from("profiles")
    .update({ nickname: nick })
    .eq("id", authUser.id)
    .select("id,nickname")
    .single();

  if(error) throw error;
  if(!data) throw new Error("Профиль пользователя не найден");
  nickname = data.nickname || "";
}

async function loadListings(){
  const { data, error } = await sb.from("listings").select("id,title,description,want,photo_url,photo_path,author,created_at,user_id").order("created_at", { ascending:false });
  if(error) throw error;
  listings = data || [];
}

async function compressImage(file){
  const bitmap = await createImageBitmap(file);
  const maxSide = 1280;
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { alpha:false });
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close();
  return await new Promise((resolve, reject)=>canvas.toBlob(b=>b ? resolve(b) : reject(new Error("Не удалось сжать фото")), "image/jpeg", 0.75));
}

async function uploadPhoto(file, listingId){
  const blob = await compressImage(file);
  const path = `${authUser.id}/${listingId}.jpg`;
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType:"image/jpeg", upsert:false });
  if(error) throw error;
  const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return { path, url:data.publicUrl };
}

async function deletePhoto(path){
  if(!path) return;
  const { error } = await sb.storage.from(STORAGE_BUCKET).remove([path]);
  if(error) console.warn("Фото не удалилось из Storage:", error);
}

function normalizeListing(item){
  return { ...item, desc:item.description || "", photo:item.photo_url || "", createdAt:item.created_at };
}

function renderProfile(){
  const label=document.getElementById("nickLabel");
  const letter=document.getElementById("avatarLetter");
  if(nickname){ label.textContent=nickname; letter.textContent=nickname[0].toUpperCase(); }
  else { label.textContent="Задать ник"; letter.textContent="?"; }
}

function renderListings(){
  const grid=document.getElementById("grid");
  if(listings.length===0){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><b>Пока пусто</b>Нажми «+», чтобы разместить первое объявление</div>';
    return;
  }
  grid.innerHTML=listings.map(item=>{
    const x=normalizeListing(item);
    return `<div class="card" data-id="${x.id}">
      ${x.photo ? `<img class="photo" src="${x.photo}" alt="">` : `<div class="photo-placeholder">📦</div>`}
      <div class="body"><h3>${escapeHtml(x.title)}</h3>
      ${x.desc ? `<p class="desc">${escapeHtml(x.desc)}</p>` : ""}
      <span class="want">⇄ ${escapeHtml(x.want)}</span>
      <footer><span>${escapeHtml(x.author)}</span>${x.user_id===authUser.id ? `<button class="del-btn" data-id="${x.id}">Удалить</button>` : ""}</footer></div></div>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(card=>card.addEventListener("click",()=>openDetail(card.dataset.id)));
  grid.querySelectorAll(".del-btn").forEach(btn=>btn.addEventListener("click",async e=>{ e.stopPropagation(); await deleteListing(btn.dataset.id); }));
}

function escapeHtml(str){ const d=document.createElement("div"); d.textContent=str ?? ""; return d.innerHTML; }

async function deleteListing(id){
  const item=listings.find(x=>String(x.id)===String(id));
  if(!item || item.user_id!==authUser.id) return;
  if(!confirm("Удалить объявление?")) return;
  const { error }=await sb.from("listings").delete().eq("id",id).eq("user_id",authUser.id);
  if(error){ alert("Не удалось удалить объявление: "+error.message); return; }
  await deletePhoto(item.photo_path);
  listings=listings.filter(x=>String(x.id)!==String(id));
  renderListings();
}

/* ---- Profile ---- */
const profileOverlay=document.getElementById("profileOverlay");
document.getElementById("profileChip").addEventListener("click",()=>{ document.getElementById("nickInput").value=nickname; profileOverlay.classList.add("open"); });
document.getElementById("profileCancel").addEventListener("click",()=>profileOverlay.classList.remove("open"));
document.getElementById("profileSave").addEventListener("click",async()=>{
  const val=document.getElementById("nickInput").value.trim();
  if(!val){ alert("Введи никнейм"); return; }
  if(val.length<2 || val.length>24){ alert("Никнейм должен быть от 2 до 24 символов"); return; }
  try{ await saveProfile(val); renderProfile(); renderListings(); profileOverlay.classList.remove("open"); }
  catch(e){ alert("Не удалось сохранить никнейм: "+e.message); }
});

/* ---- Add listing ---- */
const addOverlay=document.getElementById("addOverlay");
const photoInput=document.getElementById("photoInput");
const photoDrop=document.getElementById("photoDrop");
document.getElementById("fabAdd").addEventListener("click",()=>{
  if(!nickname){ profileOverlay.classList.add("open"); return; }
  pendingPhoto=null; photoInput.value=""; photoDrop.innerHTML='<span id="photoDropText">Нажми, чтобы выбрать фото</span>';
  document.getElementById("titleInput").value=""; document.getElementById("descInput").value=""; document.getElementById("wantInput").value="";
  addOverlay.classList.add("open");
});
document.getElementById("addCancel").addEventListener("click",()=>addOverlay.classList.remove("open"));
photoDrop.addEventListener("click",()=>photoInput.click());
photoInput.addEventListener("change",()=>{
  const file=photoInput.files[0]; if(!file) return;
  if(!file.type.startsWith("image/")){ alert("Выбери изображение"); photoInput.value=""; return; }
  const reader=new FileReader(); reader.onload=()=>{ pendingPhoto=file; photoDrop.innerHTML=`<img src="${reader.result}" alt="">`; }; reader.readAsDataURL(file);
});

document.getElementById("addSave").addEventListener("click",async()=>{
  const title=document.getElementById("titleInput").value.trim();
  const desc=document.getElementById("descInput").value.trim();
  const want=document.getElementById("wantInput").value.trim();
  if(!title){ alert("Укажи название товара"); return; }
  if(!want){ alert("Укажи, на что хочешь поменять"); return; }
  const id=crypto.randomUUID();
  let photoPath=null, photoUrl=null;
  const btn=document.getElementById("addSave"); btn.disabled=true; btn.textContent="Сохраняем…";
  try{
    if(pendingPhoto){ const uploaded=await uploadPhoto(pendingPhoto,id); photoPath=uploaded.path; photoUrl=uploaded.url; }
    const { data, error }=await sb.from("listings").insert({ id,user_id:authUser.id,title,description:desc,want,photo_url:photoUrl,photo_path:photoPath,author:nickname }).select().single();
    if(error) throw error;
    listings.unshift(data); renderListings(); addOverlay.classList.remove("open");
  }catch(e){
    if(photoPath) await deletePhoto(photoPath);
    alert("Не удалось создать объявление: "+e.message);
  }finally{ btn.disabled=false; btn.textContent="Опубликовать"; }
});

/* ---- Detail ---- */
const detailOverlay=document.getElementById("detailOverlay");
function openDetail(id){
  const raw=listings.find(x=>String(x.id)===String(id)); if(!raw) return;
  const item=normalizeListing(raw); currentListingId=id;
  document.getElementById("detailPhotoWrap").innerHTML=item.photo ? `<img class="detail-photo" src="${item.photo}" alt="">` : `<div class="detail-photo-placeholder">📦</div>`;
  document.getElementById("detailTitle").textContent=item.title;
  document.getElementById("detailWant").textContent="⇄ "+item.want;
  document.getElementById("detailDesc").textContent=item.desc || "Без описания.";
  document.getElementById("detailAuthor").textContent=item.author;
  document.getElementById("detailAvatar").textContent=(item.author||"?")[0].toUpperCase();

  // Владелец своего объявления не может открыть чат с самим собой.
  const isOwnListing = String(item.user_id) === String(authUser.id);
  document.getElementById("detailChatBtn").style.display = isOwnListing ? "none" : "flex";

  detailOverlay.classList.add("open");
}
document.getElementById("detailClose").addEventListener("click",()=>detailOverlay.classList.remove("open"));

/* ---- Chats + Chat ---- */
const chatsOverlay=document.getElementById("chatsOverlay");
const chatOverlay=document.getElementById("chatOverlay");
let currentChatPartnerId=null;
let currentChatOwnerId=null;

async function loadChatList(){
  const box=document.getElementById("chatList");
  box.innerHTML='<div class="chat-list-empty">Загружаем чаты…</div>';

  /*
    Важно: чат определяется не только объявлением, но и вторым пользователем.
    Например, если к одному объявлению написали Петя и Маша, это два разных чата.
    Если ты первым написал владельцу объявления, такой чат тоже появляется здесь.
  */
  const ownListings=listings.filter(x=>String(x.user_id)===String(authUser.id));
  const listingIds=listings.map(x=>x.id);

  if(!listingIds.length){
    box.innerHTML='<div class="chat-list-empty">Пока нет объявлений и чатов.</div>';
    return;
  }

  const { data, error }=await sb.from("messages")
    .select("id,listing_id,user_id,recipient_id,author,text,created_at")
    .in("listing_id",listingIds)
    .order("created_at",{ascending:false});

  if(error){
    box.innerHTML='<div class="chat-list-empty">Не удалось загрузить список чатов.</div>';
    console.error(error);
    return;
  }

  const grouped=new Map();

  for(const m of (data||[])){
    const listing=listings.find(x=>String(x.id)===String(m.listing_id));
    if(!listing) continue;

    const ownerId=String(listing.user_id);
    const meId=String(authUser.id);
    const senderId=String(m.user_id);
    const recipientId=m.recipient_id ? String(m.recipient_id) : null;

    // В новой схеме recipient_id однозначно определяет второго участника.
    // Старые сообщения без recipient_id намеренно не показываем: они относятся
    // к старой общей схеме и будут удалены SQL-сбросом.
    if(!recipientId) continue;
    if(senderId!==meId && recipientId!==meId) continue;

    const partnerId = senderId===meId ? recipientId : senderId;

    if(!partnerId || partnerId===meId) continue;

    const key=String(m.listing_id)+"::"+partnerId;
    if(!grouped.has(key)){
      grouped.set(key,{
        ...m,
        listing,
        partnerId,
        ownerId,
        isOwnListing:ownerId===meId
      });
    }
  }

  const chats=[...grouped.values()]
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  if(!chats.length){
    box.innerHTML='<div class="chat-list-empty">Пока нет чатов. Открой объявление и напиши первым.</div>';
    return;
  }

  box.innerHTML=chats.map(c=>{
    const partnerName=c.isOwnListing
      ? c.author
      : (c.listing?.author || "Владелец");

    return `
      <button class="chat-list-item"
        data-listing-id="${escapeHtml(String(c.listing_id))}"
        data-user-id="${escapeHtml(String(c.partnerId))}">
        <div class="chat-list-title">👤 ${escapeHtml(partnerName)} · ${escapeHtml(c.listing?.title||"Объявление")}</div>
        <div class="chat-list-preview">${escapeHtml(c.text)}</div>
      </button>
    `;
  }).join("");

  box.querySelectorAll(".chat-list-item").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      currentListingId=btn.dataset.listingId;
      currentChatPartnerId=btn.dataset.userId;

      const item=listings.find(x=>String(x.id)===String(currentListingId));
      if(!item) return;

      currentChatOwnerId=String(item.user_id);

      const partnerMessage=(data||[]).find(m=>
        String(m.listing_id)===String(currentListingId) &&
        String(m.user_id)===String(currentChatPartnerId)
      );

      const partnerName=String(item.user_id)===String(authUser.id)
        ? (partnerMessage?.author || "Пользователь")
        : (item.author || "Владелец");

      document.getElementById("chatHeader").textContent=
        "Чат · "+partnerName+" — "+item.title;

      await renderChat(currentListingId,currentChatPartnerId);
      chatsOverlay.classList.remove("open");
      chatOverlay.classList.add("open");
    });
  });
}

document.getElementById("openChatsBtn").addEventListener("click",async()=>{
  if(!authUser) return;
  chatsOverlay.classList.add("open");
  await loadChatList();
});

document.getElementById("chatsClose").addEventListener("click",()=>{
  chatsOverlay.classList.remove("open");
});

document.getElementById("chatClose").addEventListener("click",()=>{
  chatOverlay.classList.remove("open");
  // Возвращаемся к карточке объявления, если чат был открыт из неё.
  if(currentListingId){
    detailOverlay.classList.add("open");
  }
});

async function renderChat(listingId,partnerId=null){
  const item=listings.find(x=>String(x.id)===String(listingId));
  if(!item || !authUser) return;

  const meId=String(authUser.id);
  const ownerId=String(item.user_id);
  const otherId=partnerId ? String(partnerId) : ownerId;

  // Нельзя открыть чат с самим собой.
  if(otherId===meId){
    document.getElementById("chatMessages").innerHTML=
      '<div class="chat-empty">Нельзя открыть чат со своим объявлением.</div>';
    return;
  }

  currentListingId=listingId;
  currentChatPartnerId=otherId;
  currentChatOwnerId=ownerId;

  /*
    Ключевой фикс: сообщения фильтруются одновременно по объявлению
    и по двум участникам текущего диалога.
    Поэтому ответ одному человеку не попадёт в чат другого.
  */
  const { data,error }=await sb.from("messages")
    .select("id,user_id,recipient_id,author,text,created_at")
    .eq("listing_id",listingId)
    .order("created_at",{ascending:true});

  const box=document.getElementById("chatMessages");
  if(error){
    box.innerHTML='<div class="chat-empty">Не удалось загрузить чат.</div>';
    console.error(error);
    return;
  }

  const chatMessages=(data||[]).filter(m=>{
    const uid=String(m.user_id);
    const rid=m.recipient_id ? String(m.recipient_id) : "";
    return (uid===meId && rid===otherId) || (uid===otherId && rid===meId);
  });

  if(!chatMessages.length){
    box.innerHTML='<div class="chat-empty">Сообщений пока нет. Напиши первым!</div>';
    return;
  }

  box.innerHTML=chatMessages.map(m=>
    `<div class="msg ${String(m.user_id)===meId?"me":"them"}">${escapeHtml(m.text)}</div>`
  ).join("");
  box.scrollTop=box.scrollHeight;
}

document.getElementById("detailChatBtn").addEventListener("click",async()=>{
  const raw=listings.find(x=>String(x.id)===String(currentListingId));
  if(!raw) return;

  const item=normalizeListing(raw);
  if(String(item.user_id)===String(authUser.id)) return;

  currentChatOwnerId=String(item.user_id);
  currentChatPartnerId=String(item.user_id);

  document.getElementById("chatHeader").textContent=
    "Чат · "+item.author+" — "+item.title;

  detailOverlay.classList.remove("open");
  await renderChat(item.id,item.user_id);
  chatOverlay.classList.add("open");
});

document.getElementById("chatSend").addEventListener("click",sendChatMsg);
document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter") sendChatMsg();});

async function sendChatMsg(){
  const input=document.getElementById("chatInput");
  const text=input.value.trim();

  if(!text || !currentListingId || !currentChatPartnerId) return;

  const meId=String(authUser.id);
  const partnerId=String(currentChatPartnerId);

  if(meId===partnerId){
    alert("Нельзя отправить сообщение самому себе.");
    return;
  }

  const { error }=await sb.from("messages").insert({
    listing_id:currentListingId,
    user_id:authUser.id,
    recipient_id:partnerId,
    author:nickname,
    text
  });

  if(error){
    alert("Не удалось отправить сообщение: "+error.message);
    return;
  }

  input.value="";
  await renderChat(currentListingId,currentChatPartnerId);
}

let listingsChannel,messagesChannel;
function subscribeRealtime(){
  listingsChannel=sb.channel("public-listings")
    .on("postgres_changes",{event:"*",schema:"public",table:"listings"},async()=>{
      await loadListings();
      renderListings();
      if(chatsOverlay.classList.contains("open")) await loadChatList();
    })
    .subscribe();

  messagesChannel=sb.channel("listing-messages")
    .on("postgres_changes",{event:"*",schema:"public",table:"messages"},async payload=>{
      const changedId=payload.new?.listing_id || payload.old?.listing_id;

      if(currentListingId && String(changedId)===String(currentListingId) && chatOverlay.classList.contains("open")){
        await renderChat(currentListingId, currentChatPartnerId);
      }

      if(chatsOverlay.classList.contains("open")){
        await loadChatList();
      }
    })
    .subscribe();
}

async function init(){
  try{
    await ensureAuth();
    await loadProfile();
    await loadListings();
    renderProfile(); renderListings(); subscribeRealtime();
  }catch(e){
    console.error(e);
    alert("Не удалось подключиться к Supabase. Включи Anonymous Auth и выполни новый SQL.\n\n"+e.message);
  }
}
init();
</script>
